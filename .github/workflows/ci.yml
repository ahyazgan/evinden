name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Edge Function tip denetimi
        run: npx -y deno@2 check supabase/functions/payment-init/index.ts supabase/functions/payment-callback/index.ts supabase/functions/payment-refund/index.ts supabase/functions/payment-reconcile/index.ts supabase/functions/payment-approve/index.ts supabase/functions/submerchant-sync/index.ts supabase/functions/einvoice-submit/index.ts supabase/functions/einvoice-status/index.ts
