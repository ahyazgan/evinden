name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Edge Function tip denetimi
        run: npx -y deno@2 check supabase/functions/payment-init/index.ts supabase/functions/payment-callback/index.ts supabase/functions/payment-refund/index.ts
